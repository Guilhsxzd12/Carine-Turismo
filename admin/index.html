<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão | Carine Turismo</title><link rel="icon" href="../assets/logo/favicon-carine.png"><link rel="stylesheet" href="../css/style.css"><style>
body{background:#f4f7f6}.admin-shell{max-width:1280px;margin:auto;padding:38px 20px 70px}.admin-card{background:#fff;border:1px solid #dde5e3;border-radius:22px;padding:24px;box-shadow:0 14px 38px rgba(15,35,40,.07)}.login-card{max-width:430px;margin:8vh auto}.login-card img{width:74px;height:74px;object-fit:contain}.login-card h1{margin-top:14px}.admin-card label{display:grid;gap:7px;font-weight:750;font-size:.9rem}.admin-card input,.admin-card select,.admin-card textarea{width:100%;border:1px solid #d7dfdd;border-radius:10px;padding:11px 12px;font:inherit;outline:none}.admin-card textarea{resize:vertical}.admin-card input:focus,.admin-card select:focus,.admin-card textarea:focus{border-color:#f5a623}.admin-top,.list-head,.form-actions{display:flex;align-items:center;justify-content:space-between;gap:14px}.admin-layout{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(440px,1.1fr);gap:22px;margin-top:22px;align-items:start}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wide{grid-column:1/-1}.check{display:flex!important;grid-column:1/-1;grid-template-columns:auto 1fr!important;align-items:center}.check input{width:auto}.form-actions{justify-content:flex-start;margin-top:20px}.msg{min-height:20px;color:#a44218}.admin-list{display:grid;gap:10px;margin-top:15px}.admin-item{border:1px solid #e0e6e4;border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.admin-item small{color:#71807e}.admin-item-actions{display:flex;gap:7px}.mini{border:1px solid #d9e0de;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.danger{color:#a52323}@media(max-width:900px){.admin-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.admin-top{align-items:flex-start}.admin-item{grid-template-columns:1fr}.admin-item-actions{justify-content:flex-start}}

</style></head><body><main class="admin-shell"><section id="login" class="admin-card login-card"><img src="../assets/logo/favicon-carine.png" alt=""><h1>Painel Carine Turismo</h1><p>Área restrita para gerenciar o catálogo.</p><form id="login-form" method="post" action="/api/login"><label>Usuário<input name="user" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary">Entrar</button><p id="login-msg" class="msg"></p></form></section><section id="panel" hidden><div class="admin-top"><div><span class="eyebrow">CARINE TURISMO</span><h1>Gerenciar catálogo</h1></div><button id="logout" class="btn btn-outline">Sair</button></div><div class="admin-layout"><form id="item-form" class="admin-card"><input type="hidden" name="dbid"><h2 id="form-title">Adicionar item</h2><div class="form-grid"><label>Tipo<select name="tipo"><option value="passeio">Passeio</option><option value="ingresso">Ingresso</option><option value="hotel">Hotel</option><option value="evento">Evento</option></select></label><label>Categoria<input name="categoria" placeholder="Foz do Iguaçu"></label><label class="wide">Nome<input name="nome" required placeholder="Ex.: Parque das Aves"></label><label class="wide">Local<input name="local" placeholder="Ex.: Rodovia das Cataratas"></label><label class="wide">URL da foto<input name="imagem" required placeholder="https://..."></label><label class="wide">Resumo<textarea name="resumo" rows="3" required></textarea></label><label class="wide">Descrição completa<textarea name="descricao" rows="4"></textarea></label><label>Preço/legenda<input name="preco" value="Preço sob consulta"></label><label>Valor (ingressos/eventos)<input name="valor" placeholder="Ex.: R$ 120"></label><label>Ordem<input name="ordem" type="number" value="999"></label><label class="check"><input name="destaque" type="checkbox"> Indicação da semana</label><label class="wide">Itens inclusos <small>(um por linha)</small><textarea name="inclui" rows="4"></textarea></label><label class="wide">Observação<textarea name="observacao" rows="3"></textarea></label><label class="wide">Contato do hotel<input name="contato" placeholder="https://..."></label></div><div class="form-actions"><button class="btn btn-primary">Salvar</button><button id="cancel-edit" type="button" class="btn btn-outline">Limpar</button></div><p id="form-msg" class="msg"></p></form><section class="admin-card"><div class="list-head"><h2>Itens cadastrados</h2><button id="refresh" class="btn btn-outline">Atualizar</button></div><div id="items" class="admin-list"></div></section></div></section></main><script>
const $=s=>document.querySelector(s);let rows=[];const login=$('#login'),panel=$('#panel'),form=$('#item-form'),msg=$('#form-msg');
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Erro na solicitação');return data}
async function load(){try{rows=await api('/api/admin-list');login.hidden=true;panel.hidden=false;render();return true}catch(err){login.hidden=false;panel.hidden=true;const m=document.querySelector('#login-msg');if(m&&!/Não autorizado/i.test(err.message))m.textContent='Login ok, mas o catálogo não carregou: '+err.message;return false}}
function render(){$('#items').innerHTML=rows.length?rows.map(r=>`<div class="admin-item"><div><b>${esc(r.dados?.nome||'Sem nome')}</b><br><small>${esc(r.tipo)} · ${esc(r.dados?.categoria||'')}</small></div><div class="admin-item-actions"><button class="mini" data-edit="${r.id}">Editar</button><button class="mini danger" data-del="${r.id}">Excluir</button></div></div>`).join(''):'<p>Nenhum item cadastrado no banco.</p>'}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/login',{method:'POST',body:JSON.stringify({user:f.get('user'),password:f.get('password')})});$('#login-msg').textContent='';await load()}catch(err){$('#login-msg').textContent=err.message}};
form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);const nome=f.get('nome').trim();const dados={id:nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),nome,categoria:f.get('categoria').trim(),local:f.get('local').trim(),imagem:f.get('imagem').trim(),resumo:f.get('resumo').trim(),descricao:f.get('descricao').trim(),preco:f.get('preco').trim(),valor:f.get('valor').trim(),destaque:f.get('destaque')==='on',inclui:f.get('inclui').split('\n').map(x=>x.trim()).filter(Boolean),observacao:f.get('observacao').trim(),contato:f.get('contato').trim()};const dbid=f.get('dbid');try{await api('/api/catalog',{method:dbid?'PUT':'POST',body:JSON.stringify({id:dbid,tipo:f.get('tipo'),ordem:f.get('ordem'),dados})});msg.textContent='Salvo com sucesso.';clear();await load()}catch(err){msg.textContent=err.message}};
$('#items').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;const r=rows.find(x=>String(x.id)===String(id));if(e.target.dataset.edit){const d=r.dados||{};for(const [k,v] of Object.entries({dbid:r.id,tipo:r.tipo,ordem:r.ordem||999,...d,inclui:(d.inclui||[]).join('\n')})){const el=form.elements[k];if(!el)continue;if(el.type==='checkbox')el.checked=!!v;else el.value=v??''}$('#form-title').textContent='Editar item';scrollTo({top:0,behavior:'smooth'})}else if(confirm(`Excluir “${r.dados?.nome}”?`)){await api('/api/catalog',{method:'DELETE',body:JSON.stringify({id:r.id})});await load()}};
function clear(){form.reset();form.elements.dbid.value='';form.elements.preco.value='Preço sob consulta';form.elements.ordem.value='999';$('#form-title').textContent='Adicionar item'}$('#cancel-edit').onclick=clear;$('#refresh').onclick=load;$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};load();

</script></body></html>
